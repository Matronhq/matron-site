<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found — Matron</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="stylesheet" href="/style.css?v=3">
</head>
<body>

<header class="site">
  <div class="wrap">
    <img src="/assets/icon-256.png" alt="" width="36" height="36">
    <a class="brand" href="/">matron</a>
    <nav class="main" id="nav">
      <a href="/#features">Features</a>
      <a href="/#how">How it works</a>
      <a href="/dev-boxer/">dev-boxer</a>
      <a href="https://github.com/Matronhq">GitHub</a>
      <a href="/privacy/">Privacy</a>
      <a href="/support/">Support</a>
    </nav>
    <button class="nav-toggle" type="button" aria-label="Menu" aria-expanded="false" aria-controls="nav">&#9776;</button>
  </div>
</header>

<main class="notfound">
  <div class="code">[ 404 ]</div>
  <p>This page doesn&rsquo;t exist. Even the agent couldn&rsquo;t find it.</p>
  <p><a href="/">Back to the start</a></p>
</main>

<script>
var navToggle = document.querySelector('.nav-toggle');
if (navToggle) {
  var nav = document.getElementById('nav');
  navToggle.addEventListener('click', function () {
    var open = nav.classList.toggle('open');
    navToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  nav.addEventListener('click', function (e) {
    if (e.target.tagName === 'A') {
      nav.classList.remove('open');
      navToggle.setAttribute('aria-expanded', 'false');
    }
  });
}
</script>
</body>
</html>
